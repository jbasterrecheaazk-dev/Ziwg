<!DOCTYPE html>
<html lang="eu">
<head>
    <meta charset="UTF-8">
    <title>Etxegabetze-auzia editatu</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f4f6f9; }
        .form-card { background: white; padding: 25px; border-radius: 8px; max-width: 500px; margin: auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        select:disabled { background-color: #e9ecef; color: #495057; cursor: not-allowed; }
        button { background: #f39c12; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="form-card">
    <h2>Auziaren informazioa eguneratu</h2>
    <form action="" method="POST">

        <!-- Ezkutuko identifikatzailea, auziaren IDa bidaltzeko -->
        <input type="hidden" name="id_auzia" value="1">

        <!-- Desgaitutako hautatzailea, kaltetutako familiarentzat (IDa + izena) -->
        <div class="form-group">
            <label for="id_auzia_select">Kaltetutako familia:</label>
            <select id="id_auzia_select" disabled>
                <!-- Hautatutako aukera: id_auzia eta kaltetutako_familia -->
                <option value="1" selected>1 - García Pérez familia</option>
                <!-- Dinamikoan (PHP/MVC), hemen zerrenda edo uneko aukera beteko litzateke -->
                <option value="2">IDa: 2 - Ahmed Benali familia</option>
                <option value="3">IDa: 3 - Martínez López familia</option>
            </select>
        </div>

        <div class="form-group">
            <label for="helbidea">Etxebizitzaren helbidea:</label>
            <input type="text" id="helbidea" name="etxebizitza_helbidea" value="Kale Nagusia 45, 2.B" required>
        </div>

        <div class="form-group">
            <label for="gastuak">Aurreikusitako lege-gastuak (€):</label>
            <input type="number" step="0.01" id="gastuak" name="aurreikusitako_lege_gastuak" value="2500.00" required>
        </div>

        <div class="form-group">
            <label for="egoera">Prozesu-egoera:</label>
            <select id="egoera" name="egoera">
                <option value="Prozesuan" selected>Prozesuan</option>
                <option value="Etenda">Etenda</option>
                <option value="Geldituta">Geldituta</option>
                <option value="Amaituta">Amaituta</option>
            </select>
        </div>

        <button type="submit">Aldaketak gorde</button>
        <a href="">Itzuli</a>
    </form>
</div>

</body>
</html>
