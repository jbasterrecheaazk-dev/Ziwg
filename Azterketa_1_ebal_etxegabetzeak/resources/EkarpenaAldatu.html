<!DOCTYPE html>
<html lang="eu">

<head>
    <meta charset="UTF-8">
    <title>Ekarpen ekonomikoa editatu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f4f6f9;
        }

        .form-card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            background: #f39c12;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
        }

        a.btn-cancel {
            text-decoration: none;
            color: #555;
            margin-left: 10px;
        }
    </style>
</head>

<body>

    <div class="form-card">
        <h2>Ekarpenaren datuak aldatu</h2>
        <form action="" method="POST">

            <input type="hidden" name="id_ekarpena" value="3">

            <div class="form-group">
                <label for="id_auzia">Lotutako auzia:</label>
                <select id="id_auzia" name="id_auzia" required>
                                                                        <option value="3" >
                                ID #3 - Martínez López familia                            </option>
                                                    <option value="2" selected>
                                ID #2 - Ahmed Benali familia                            </option>
                                                    <option value="1" >
                                ID #1 - García Pérez familia                            </option>
                                                            </select>
            </div>

            <div class="form-group">
                <label for="emaile_izena">Emailearen edo erakundearen izena:</label>
                <input type="text" id="emaile_izena" name="emaile_izena" value="María Luisa Gómez" required>
            </div>

            <div class="form-group">
                <label for="emaile_emaila">Posta elektronikoa:</label>
                <input type="email" id="emaile_emaila" name="emaile_emaila" value="mluisa@email.com">
            </div>

            <div class="form-group">
                <label for="emandako_zenbatekoa">Emandako zenbatekoa (€):</label>
                <input type="number" step="0.01" id="emandako_zenbatekoa" name="emandako_zenbatekoa" value="200.00" required>
            </div>

            <button type="submit">Aldaketak gorde</button>
            <a href="" class="btn-cancel">Utzi</a>
        </form>
    </div>

</body>

</html>
